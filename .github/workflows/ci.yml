name: Verify source preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      AEGIS_TEST_DATABASE_URL: postgresql://aegis:synthetic_ci_only@127.0.0.1:5432/aegis
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e ./sdk/python -e ./policy-engine -e ./runtime -e ./collector
      - run: python -m pip check
      - run: python scripts/repository_check.py --commit HEAD
      - run: python scripts/repository_check.py --history
      - run: python scripts/public_check.py
      - run: python scripts/check.py --postgres
      - if: failure()
        run: cat artifacts/check/tests.log
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python ../scripts/third_party_notices.py --check
      - run: python ../scripts/check_dashboard.py
      - if: failure()
        run: cat ../artifacts/dashboard-check/check.log
  local-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e ./sdk/python -e ./policy-engine -e ./runtime -e ./collector
      - run: python scripts/platform_smoke.py --project aegis-smoke-ci --output artifacts/platform-smoke-ci
      - if: failure()
        run: cat artifacts/platform-smoke-ci/*.log
