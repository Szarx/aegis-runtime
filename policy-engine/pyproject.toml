[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-runtime-policy"
version = "0.1.0.dev0"
description = "Aegis local exact-match tool authorization policies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegis_policy*"]
namespaces = false
